.blk-category-event { --blk-color: var(--cat-event); }
.blk-category-motion { --blk-color: var(--cat-motion); }

.blk-category-sound { --blk-color: var(--cat-sound); }
.blk-category-control { --blk-color: var(--cat-control); }
.blk-category-sensing { --blk-color: var(--cat-sensing); }
.blk-category-device { --blk-color: var(--cat-device); }
.blk-category-operators { --blk-color: var(--cat-operators); }

.blk-input input, .blk-input select { width: 64px; min-height: 28px; padding: 0 5px; border: 0; border-radius: 12px; background: #fff; text-align: center; font-weight: 900; }
.blk-input select { width: auto; max-width: 110px; }

.blk-static { display: grid; place-items: center; min-width: 30px; min-height: 26px; padding: 0 5px; }
.blk-static--color { min-width: 24px; width: 24px; min-height: 24px; padding: 0; border: 3px solid #fff; border-radius: 50%; background: var(--chip-color); box-shadow: 0 0 0 1px #50615f; }

.blk-color { width: 28px; height: 28px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #50615f; }
.script-stack { position: relative; display: grid; gap: 4px; width: min(100%, 390px); }
.script-stack > .blk { width: 100%; }
.palette .blk { width: 100%; min-height: 52px; padding: 10px; font-size: .85rem; text-align: left; }
.palette .blk::after { content: "+"; position: absolute; top: 50%; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.22); transform: translateY(-50%); }
.drop-marker { height: 12px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 3px #23665e, 0 4px 10px rgba(0,0,0,.18); }
.blk-body__hint { display: block; padding: 7px; border: 2px dashed rgba(23,53,54,.24); border-radius: 8px; color: #6e7d78; text-shadow: none; font-size: .72rem; }
.blk--inline { display: inline-flex; width: auto !important; min-height: 36px !important; padding: 6px 9px !important; border-width: 2px; font-size: .8rem !important; vertical-align: middle; }
@keyframes error-pulse { 50% { filter: brightness(1.4); } }
</style>

  .output-item .rotor { animation: none; }
}
.device-meter { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; align-items: center; }
.device-meter h3 { grid-column: 1 / -1; margin: 0; }
.use-time { font-size: 1.35rem; color: var(--accent-dark); }
.energy-score { color: var(--accent-dark); font-size: .78rem; font-weight: 900; }
.energy-bar { grid-column: 1 / -1; height: 11px; overflow: hidden; border-radius: 6px; background: #e0e8f0; }
.energy-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #45a957, #f6c744, #df594f); transition: width .2s; }
.record-list { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.record-list span { padding: 5px 8px; border-radius: 7px; background: #ecf1f7; font-size: .7rem; font-weight: 800; }
@keyframes motor-spin { to { transform: rotate(360deg); } }

#device-stage.is-active { display: block; overflow: auto; padding: 8px; }
.experiment { grid-template-columns: minmax(0,1fr); height: auto; gap: 7px; }
.experiment .device-card { padding: 9px; border-radius: 8px; }
.condition-rule,.scene-options { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.condition-rule { font-size: .87rem; }
.condition-rule select,.scene-options button {
  min-height: 44px; padding: 4px 8px; border: 1px solid #99adc2; border-radius: 6px;
  background: #fff; font-size: .85rem; font-weight: 700; }
.scene-options [aria-pressed="true"] { background: var(--accent); color: white; }
.experiment-guide { margin: 7px 0 0; font-size: .85rem; color: #405971; }
.experiment [hidden] { display: none; }
.experiment summary { padding: 4px; cursor: pointer; font-size: .88rem; font-weight: 700; }
.experiment .device-meter { margin-top: 8px; grid-template-columns: repeat(2,minmax(0,1fr)); }
.experiment .output-grid { margin-top: 8px; }

  <style>/* Field Atlas: compact instruments around a large, readable map and script. */
:root {
  --ink: #162c45; --muted: #486077; --line: #c3d1df; --accent: #234c79;
  --accent-dark: #112540; --paper: #fbfcfe; --radius: 12px;
  --shadow: none; --shadow-soft: none;
  --cat-event: #946419; --cat-motion: #317285; --cat-looks: #70548c;
  --cat-sound: #a14972; --cat-control: #a95029; --cat-sensing: #357b77;
  --cat-device: #507446; --cat-operators: #69722e;
  --navy: #112540; --navy-panel: #223e5e; --night-line: #526b87;
  --ice: #aed0ec; --amber: #f2bf78;
  background: var(--navy);
}
body { background: var(--navy); overflow: auto; }
.app-shell { display: flex; flex-direction: column; width: min(100%, 1740px); height: auto; min-height: 100dvh; margin: auto; padding: 0 clamp(14px, 2.8vw, 52px) 24px; gap: 0; }
.masthead { display: flex; align-items: center; min-height: 75px; gap: clamp(18px, 4vw, 72px); color: white; }
.brand { display: inline-flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; color: #f5f8fc; }
.atlas-logo { width: 40px; height: 40px; flex-shrink: 0; }
.brand__words { display: grid; text-align: left; }
.brand__words strong { font-size: 1.12rem; line-height: 1.35; letter-spacing: .04em; }
.brand__words small { font: 700 .65rem/1.4 ui-monospace, Consolas, monospace; letter-spacing: .23em; color: var(--ice); }
.atlas-nav, .mast-actions, .lab-title { display: flex; align-items: center; }
.atlas-nav { align-self: stretch; gap: 24px; }
.atlas-nav :is(a,button) { display: grid; place-items: center; border: 0; background: none; padding: 2px 2px 0; color: #c4d7eb; font-size: .9rem; font-weight: 700; text-decoration: none; }
.atlas-nav .nav-current { color: white; box-shadow: inset 0 -3px var(--amber); }
.atlas-nav :is(a,button):hover { color: #fff; }
.mast-actions { margin-left: auto; gap: 8px; }
.mast-actions svg, #destination-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linejoin: round; }
.tool-btn, .icon-btn, .toolbar select { box-shadow: none; border-radius: 8px; }
.mast-actions :is(.tool-btn,.icon-btn),.toolbar :is(.tool-btn,.icon-btn,select) { color: #f2f7fc; background: var(--navy-panel); border-color: var(--night-line); }
.mast-actions #save-btn { display: flex; align-items: center; gap: 8px; }
.mast-actions :is(.tool-btn,.icon-btn):hover,.toolbar .icon-btn:not(:disabled):hover { background: #335375; border-color: #8cafcf; }
.mast-actions #help-btn { border-radius: 50%; }
.landscape { position: relative; isolation: isolate; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; min-height: clamp(167px, 15vw, 235px); padding: clamp(19px, 2.4vw, 38px); overflow: hidden; color: white; border-radius: 13px; background: #243a55 center 50% / cover no-repeat; }

.landscape::before { position: absolute; content: ""; inset: 0; z-index: -1; background: linear-gradient(85deg, rgba(9,24,44,.88), rgba(13,32,52,.36) 50%, transparent 80%), linear-gradient(0deg, rgba(11,26,44,.52), transparent 65%); }
.place-region { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: .85rem; letter-spacing: .07em; }
.pin-glyph { color: #ffba78; font: bold 1.35rem/1 monospace; }
.place-copy h1 { color: #fffdf3; font-size: clamp(1.65rem,3.4vw,3.65rem); line-height: 1.2; margin: 8px 0 2px; font-weight: 800; letter-spacing: .015em; }
#place-latin { font: italic clamp(1rem,1.65vw,1.65rem)/1.4 Georgia, serif; color: #fbf6e4; }
#destination-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #ffffff80; border-radius: 7px; background: #f6f9fd; color: #18334e; font-size: .88rem; font-weight: 750; }
.toolbar { flex-wrap: wrap; min-height: 68px; padding: 9px 0; gap: 9px; color: #f2f6fb; background: var(--navy); border: 0; border-radius: 0; box-shadow: none; }
.toolbar .toolbar__speed label { color: #bfd1e3; }
.toolbar select { color-scheme: dark; }
.lab-title { gap: 10px; margin-right: auto; flex-shrink: 0; }
.lab-title h2 { font-size: 1.3rem; }
.lab-symbol { width: 25px; height: 25px; fill: none; stroke: #9dc3e7; stroke-width: 1.7; stroke-linejoin: round; }
.toolbar__primary, .toolbar__more { margin: 0; }
.toolbar__group { padding-left: 9px; border-color: #3a526a; }
.toolbar .tool-btn--run { border-color: var(--amber); background: var(--amber); color: #16283e; padding-inline: 18px; }
.toolbar .tool-btn--run:hover:enabled { background: #ffd199; }
.toolbar .tool-btn--stop { background: #243a54; color: #ffe0cf; border-color: #61768c; }
.toolbar .tool-btn--level { color: #e0ecf8; background: #2b4461; border-color: #526e87; }
.toolbar #tidy-btn { display: inline-grid; }
.toolbar :disabled { opacity: .53; }
.workspace { grid-template-columns: minmax(193px,.78fr) minmax(301px,1.4fr) minmax(305px,1.23fr); gap: 14px; min-height: 495px; height: clamp(540px, calc(100dvh - 345px), 1020px); }
.panel { border: 1px solid #3b5672; border-radius: 11px; background: #f8fbfd; }
.panel__heading { min-height: 65px; padding: 10px 16px; background: var(--navy-panel); color: #f5f8fd; border-bottom-color: #49637c; }
.panel__heading :is(.icon-btn,.edit-actions button) { color: #edf6fd; background: #2d4b69; border-color: #57728d; }
.panel__heading h2 { font-size: 1.06rem; }
.eyebrow, .mission-card__kicker { font: 700 .72rem/1.35 ui-monospace, Consolas, monospace; letter-spacing: .12em; color: #acc6e1; }
.palette-panel { display: flex; flex-direction: column; }
.palette { flex: 1; min-height: 105px; }
.category-tabs { display: flex; flex-flow: row wrap; gap: 4px; padding: 10px 10px 8px; border-bottom: 1px solid var(--line); overflow-y: auto; max-height: 39%; flex-shrink: 0; }
.category-tab { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; padding: 3px 7px; border: 1px solid #c4d2df; border-radius: 6px; font-size: .81rem; background: #edf3f8; }
.category-tab .cat-icon { display: inline; font-size: .87rem; }
.category-tab[aria-selected="true"] { background: #244768; color: #fff; border-color: #244768; }
.editor-panel { display: flex; flex-direction: column; }
.editor-heading { gap: 5px; }
.editor-heading > div:first-child { min-width: 0; }
#project-name { min-width: 0; padding: 0; line-height: 1.45; overflow-wrap: anywhere; }
.edit-actions { gap: 2px; flex-shrink: 0; }
.edit-actions button { min-width: 35px; min-height: 44px; border-radius: 5px; background: transparent; }
.script-canvas { flex: 1; min-height: 120px; padding: 22px 18px; background: #edf2f7 radial-gradient(#bdcdda 1px, transparent 1.3px) 0 0 / 16px 16px; }
.script-stack { max-width: 355px; }
.blk { text-shadow: none; border-radius: 7px; border-bottom-width: 2px; box-shadow: none; }
.blk--hat { border-top-left-radius: 20px; }
.blk--value { border-radius: 22px; } .blk--bool { border-radius: 6px 20px; }
.blk--c > .blk-band { border-radius: 8px 8px 3px 3px; box-shadow: none; }
.blk--c .blk-body { border-left-width: 10px; margin-left: 8px; padding: 5px 0 5px 7px; }
.blk-foot { height: 11px; border-radius: 0 0 6px 6px; }
.blk-input { border-radius: 8px; border-width: 1px; }
.palette .blk { padding-right: 34px; }
.blk.is-selected { outline: 3px solid #183955; outline-offset: 2px; }
.blk.is-running { outline: 4px solid #e9ab25; outline-offset: 1px; }
.blk[data-drop-position="before"] { box-shadow: 0 -5px 0 #ed883e; }
.blk[data-drop-position="after"] { box-shadow: 0 5px 0 #ed883e; }
.blk-body.is-drop-target, .blk-input.is-slot-selected { outline: 3px dashed #de7828; outline-offset: 1px; }
.stage-panel { display: flex; flex-direction: column; }
.stage-heading { padding: 3px 10px; min-height: 49px; background: #e7eef5; gap: 2px; }
.stage-tabs, .stage-tools { gap: 2px; }
.stage-tab { padding: 0 8px; min-height: 42px; border-radius: 6px; font-size: .88rem; }
.stage-tab.is-active { background: #264768; color: #fff; border-color: #264768; }
.stage-tools .icon-btn { min-width: 35px; border: 0; background: transparent; }
.run-status { border-radius: 4px; background: #304c68; padding: 4px 8px; color: #dcebf8; font-size: .78rem; font-weight: 700; }
.run-status[data-active="true"] { background: var(--ice); color: #163350; }
.stage { flex: 1; min-height: 170px; padding: 10px 10px 4px; }
.stage-view { border: 1px solid #b5c8da; border-radius: 7px; }
#turtle-stage { background: #eef0df; }
#turtle-stage::after { content: "N"; position: absolute; top: 9px; right: 10px; border-top: 5px solid #445f74; padding-top: 2px; color: #445f74; font: 700 .75rem/1 monospace; pointer-events: none; }
.mission-card { order: 2; margin: 4px 10px 11px; padding: 11px; background: #edf2f8; color: #1e3755; border: 1px solid #c8d6e4; border-radius: 7px; align-items: start; }
.mission-card__icon { width: 27px; height: 27px; margin-top: 2px; background: #dce8f4; color: #345073; font-family: Georgia, serif; }
.mission-card__kicker { color: #445e79; font-size: .74rem; }
#mission-title { white-space: normal; line-height: 1.5; }
#mission-progress { color: #43596e; font-size: .83rem; line-height: 1.5; }
#goal-count { color: #274c70; font-weight: 750; }
.mission-card button { border-color: #bacbdd; border-radius: 5px; font-size: .85rem; }
.monitors { min-height: 30px; padding: 3px 12px; align-items: center; }
.monitor { background: transparent; border-radius: 0; color: #395774; font-family: ui-monospace, monospace; }
.insert-mode { flex-wrap: wrap; justify-content: flex-start; gap: 4px; }
.code-panel { flex: 0 1 auto; max-height: 44%; overflow: auto; }
.site-list { display: grid; gap: 9px; }
.site-list section { display: grid; gap: 5px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.trail-head, .site-list button { display: flex; justify-content: space-between; align-items: center; gap: 7px; text-align: left; }
.trail-head h3 { flex: 1; margin: 0; }
.trail-head span:last-child, .site-list small { font-size: .81rem; }
.site-list button { width: 100%; }
.site-list button > small { flex-shrink: 0; white-space: nowrap; }
.site-list button:disabled { opacity: 1; color: #57697c; background: #e8eef4; }
.mission-limit { display: block; font-weight: 500; }
.site-list .has-crown, #goal-count.has-crown {
  display: inline-flex; flex: none; align-items: center; gap: .3em;
  padding: 2px 7px; color: #69420d; background: #fff1c9; border: 1px solid #dfbd76;
  border-radius: 6px; font-weight: 750; white-space: nowrap;
}
.mission-crown { width: 1.35em; height: 1.35em; flex: none; fill: #f8c652; stroke: #70480d; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.site-list p { font-size: .86rem; }
.site-list summary { cursor: pointer; padding: 6px; color: #2b4e70; font-size: .88rem; }
.site-list ol { margin: 0 0 6px; line-height: 1.7; }
.site-thumb { flex: 0 0 80px; height: 55px; border-radius: 5px; background-position: center; background-size: cover; }
.site-list button:enabled:hover { background: #e2edf9; }
@media (pointer: coarse) { .palette .blk { touch-action: pan-y; } }
#back-to-goal { display: none; }
@media (min-width:700px) and (max-width:1023px) {
  #back-to-goal { display: inline-block; margin-left: auto; margin-right: 8px; min-height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--accent); }
}
.briefing { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(240px,1fr); border: 1px solid #557089; border-radius: 14px; overflow: hidden; background: #fcfbf7; }
.briefing-copy { padding: clamp(15px,1.7vw,27px); min-width: 0; border-left: 4px solid var(--amber); }
.briefing-overline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #455f79; font-size: .9rem; font-weight: 750; }
.briefing-overline > :first-child { background: #dae8f5; padding: 3px 9px; border-radius: 5px; color: #203f64; }
.briefing #mission-title { display: block; margin: 7px 0 4px; font-size: clamp(1.35rem,2.2vw,2.2rem); line-height: 1.25; }
.briefing #mission-progress { color: #2c425a; font-size: 1rem; line-height: 1.55; }
.briefing-actions { margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px 12px; }

  const sources = {"js/main.js": "import { createProject, createBlock, clone, makeId, normalizeProject } from './core/project.js';\nimport { ProjectStore, autosave } from './core/store.js';\nimport { History } from './core/history.js';\nimport { decodeProject, downloadProject, encodeProject, readProjectFile } from './core/share.js';\nimport { friendlyError } from './core/errors.js';\nimport { allDefinitions, getDefinition, listDefinitions } from './blocks/registry.js';\nimport { Palette } from './ui/palette.js';\nimport { ScriptCanvas } from './ui/canvas.js';\nimport { DragController } from './ui/drag.js';\nimport { DialogManager } from './ui/dialogs.js';\nimport { Toolbar } from './ui/toolbar.js';\nimport { renderBlock } from './ui/blockview.js';\nimport { LEVELS, UI } from './ui/labels.js';\nimport { TurtleStage } from './stages/turtle.js';\nimport { SpriteStage } from './stages/sprite.js';\nimport { DeviceStage } from './stages/device.js';\nimport { FieldStage } from './field/stage.js';\nimport { Interpreter } from './runtime/interpreter.js';\nimport { Scheduler } from './runtime/scheduler.js';\nimport { jsToBlocks, projectToJS } from './runtime/tojs.js';\nimport { getMission, getExampleMission, isLegacyStarter, listMissions, missionProjectData, evaluateMission } from './missions/missions.js';\nimport { worlds } from './field/worlds.js';\nimport { Synth } from './audio/synth.js';\nimport { campaign, renderLandscape, destinationMenu, showMobileView, crownTotal, renderStampLabel, isMissionRestricted } from './expedition.js';\n\nconst params = new URLSearchParams(location.search);\nconst levelFromURL = Number(params.get('level'));\nconst levelLocked = params.get('lock') === '1';\nconst devicePractices = new Map([['science_dark', 'ライトをつける練習'], ['tech_fan', 'ファンを回す練習']]);\nlet teacherMode = params.get('teacher') === '1';\nlet easyMode = params.get('easy') === '1';\nconst store = new ProjectStore();\nconst history = new History(100);\nconst dialogs = new DialogManager(document.getElementById('dialog-root'));\nconst audio = new Synth();\nconst keys = new Set();\nlet project = createProject({ level: levelFromURL || store.level || 1 });\nlet currentMission = getMission('intro_square');\nlet customMission = null;\nlet allowedBlocks = null;\nlet scheduler = null;\nlet interpreter = null;\nlet running = false;\nlet successPlayed = false;\nlet runCompleted = false;\nlet stoppedByUser = false;\nlet stuckDialogOpen = false;\n\nconst turtleStage = new TurtleStage(document.getElementById('pen-canvas'), document.getElementById('actor-canvas'));\nconst spriteStage = new SpriteStage(document.getElementById('sprite-canvas'), function () { return project; });\nconst deviceStage = new DeviceStage(document.getElementById('device-stage'), function () { updateMissionProgress(); }, audio);\nconst fieldStage = new FieldStage((edited = true) => {\n  stoppedByUser = false; successPlayed = false; runCompleted = false;\n  if (edited) history.record(project);\n  updateToolbar(); updateMissionProgress();\n}, audio, runProject);\nconst stages = { turtle: turtleStage, sprite: spriteStage, device: deviceStage, field: fieldStage };\nconst spriteShapes = ['cat', 'robot', 'car', 'ball', 'rocket', 'bug', 'heart', 'star'];\nconst spriteBackgrounds = ['sky', 'mint', 'sunset', 'night', 'candy', 'paper'];\n\nfunction activeStage() { return stages[project.stage] || turtleStage; }\nfunction rubyEnabled() { return project.level === 3 || (project.level >= 4 && localStorage.getItem('bs.ruby') !== '0'); }\n\nfunction toast(message, error) {\n  const region = document.getElementById('toast-region');\n  const item = document.createElement('div');\n  item.className = 'toast' + (error ? ' toast--error' : '');\n  item.textContent = message;\n  region.appendChild(item);\n  setTimeout(function () { item.remove(); }, error ? 5200 : 2600);\n}\n\nfunction copyText(value) {\n  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(value);\n  const area = document.createElement('textarea');\n  area.value = value; area.style.position = 'fixed'; area.style.opacity = '0'; document.body.appendChild(area); area.select();\n  const copied = document.execCommand('copy'); area.remove();\n  return copied ? Promise.resolve() : Promise.reject(new Error('copy'));\n}\n\nfunction renderLevel() {\n  for (let level = 1; level <= 5; level += 1) document.body.classList.remove('level-' + level);\n  document.body.classList.add('level-' + project.level);\n  if (levelLocked) document.getElementById('level-btn').title = 'せんせいが レベルを きめています';\n}\n\nfunction updateStageTabs() {\n  document.querySelectorAll('.stage-tab').forEach(function (button) {\n    const active = button.dataset.stage === project.stage;\n    button.classList.toggle('is-active', active);\n    button.setAttribute('aria-selected', String(active));\n  });\n  document.querySelectorAll('.stage-view').forEach(function (view) { view.classList.toggle('is-active', view.id === project.stage + '-stage'); });\n  document.getElementById('grid-btn').hidden = project.stage !== 'turtle';\n  const firstSprite = project.sprites && project.sprites[0];\n  if (firstSprite) document.getElementById('sprite-shape-select').value = firstSprite.shape || 'cat';\n  document.getElementById('sprite-add-btn').textContent = '＋ キャラ ' + (project.sprites ? project.sprites.length : 0) + '/8';\n}\n\nfunction updateToolbar() {\n  document.getElementById('field-stop').disabled = !running;\n  const powered = project.stage === 'device' && Object.values(deviceStage.outputs).some(power => power > 0);\n  toolbar.update({ running: running, canStop: running || powered, level: project.level, levelLocked: levelLocked, canUndo: history.canUndo, canRedo: history.canRedo });\n  const status = document.getElementById('run-status');\n  status.textContent = running ? '実行中' : stoppedByUser ? '停止' : runCompleted ? '実行完了' : '待機中';\n  status.dataset.active = String(running);\n  if (project.stage === 'device') deviceStage.setProgram(project, running, () => {\n    editor.render();\n    recordChange('LEDの条件を かえたよ');\n  });\n  editor.element.inert = running;\n  document.getElementById('palette-panel').inert = running;\n  editor.updateSelectionControls();\n}\n\nfunction updateCode(force) {\n  const panel = document.getElementById('code-panel');\n  const editorPanel = document.getElementById('editor-panel');\n  const show = project.level >= 4;\n  panel.hidden = !show;\n  editorPanel.classList.toggle('has-code', show);\n  document.getElementById('apply-code-btn').hidden = project.level < 5;\n  const area = document.getElementById('code-editor');\n  if (show && (force || document.activeElement !== area)) area.value = projectToJS(project);\n}\n\nfunction renderMonitors(runtime) {\n  const root = document.getElementById('monitors');\n  let index = 0;\n  (project.vars || []).forEach(function (item) {\n    if (runtime ? runtime.varVisibility.get(item.id) === false : item.show === false) return;\n    let monitor = root.children[index++];\n    if (!monitor) {\n      monitor = document.createElement('span');\n      monitor.className = 'monitor';\n      root.appendChild(monitor);\n    }\n    const value = runtime && runtime.vars ? runtime.vars.get(item.id) : item.value;\n    const label = item.name + ' = ' + String(value ?? 0);\n    if (monitor.textContent !== label) monitor.textContent = label;\n  });\n  while (root.children.length > index) root.lastElementChild.remove();\n}\n\nfunction renderAll() {\n  renderLevel();\n  const field = project.stage === 'field';\n  const scene = field ? getMission(project.fieldScene || project.missionId) : null;\n  document.body.classList.toggle('field-mode', field);\n  if (field) fieldStage.configure(project, scene.stage === 'field' ? scene : getMission('mulu_1'));\n  turtleStage.setRegion(renderLandscape(field ? scene.id : project.missionId));\n  document.getElementById('project-name').textContent = project.name;\n  updateStageTabs();\n  if (!field) { editor.render(); palette.render(); }\n  updateToolbar();\n  if (!field) { updateCode(true); renderMonitors(interpreter); }\n  updateMissionCard();\n  activeStage().render();\n}\n\nfunction recordChange(message) {\n  discardExecution();\n  history.record(project);\n  updateToolbar();\n  updateCode(false);\n  renderMonitors(interpreter);\n  updateMissionProgress();\n  if (message) toast(message);\n}\n\nfunction restoreWork(raw) {\n  const work = normalizeProject(raw);\n  const mission = work.missionId && getMission(work.missionId);\n  if (!work.buildFromBlank && mission?.id === work.missionId && mission?.buildFromBlank && mission.stage === work.stage) {\n    if (work.stage === 'field') work.fieldProgram = work.fieldProgram.map((value, i) => i + ':' + value);\n    work.buildFromBlank = true;\n  }\n  return work;\n}\n\nfunction setProject(next, preserveMission) {\n  stopRun(false);\n  deviceStage.clearRecords();\n  project = restoreWork(next);\n  // A shared URL names the work it opened. A later selection supersedes it.\n  if (location.hash.startsWith('#p=') || location.hash.startsWith('#m=')) {\n    const url = new URL(location.href); url.hash = '';\n    window.history.replaceState(window.history.state, '', url);\n  }\n  if (levelFromURL && levelLocked) project.level = Math.max(1, Math.min(5, levelFromURL));\n  history.reset(project);\n  editor.selectedId = null;\n  editor.runningId = null;\n  interpreter = null;\n  if (!preserveMission) {\n    customMission = null;\n    currentMission = getMission(project.missionId || 'intro_square');\n    allowedBlocks = project.missionId ? currentMission.allowedBlocks : null;\n  }\n  activeStage().reset();\n  renderAll();\n}\n\nfunction selectionState(state) {\n  document.getElementById('move-up-btn').disabled = !state.up || running;\n  document.getElementById('move-down-btn').disabled = !state.down || running;\n  document.getElementById('delete-btn').disabled = !state.selected || running;\n  const insert = document.getElementById('insert-mode');\n  insert.hidden = !state.cShape || running;\n  insert.querySelectorAll('button').forEach(function (button) {\n    const active = button.dataset.insert === editor.insertMode;\n    button.hidden = button.dataset.insert === 'else' && !state.hasElse;\n    button.classList.toggle('is-active', active);\n    button.setAttribute('aria-pressed', String(active));\n  });\n}\n\nconst editor = new ScriptCanvas(document.getElementById('script-canvas'), {\n  getProject: function () { return project; },\n  rubyEnabled: rubyEnabled,\n  onChange: recordChange,\n  isRunning: function () { return running; },\n  onSelect: function () {},\n  onSelectionState: selectionState,\n  toast: toast,\n  confirmAllDeletes: function () { return easyMode; },\n  confirmDelete: function () { return dialogs.askYesNo('ブロックを けす？', 'もどす ボタンで もとに もどせるよ。', true); }\n});\n\nconst palette = new Palette(document.getElementById('category-tabs'), document.getElementById('palette'), document.getElementById('palette-search'), {\n  getState: function () { return { level: project.level, stage: project.stage, project: project, rubyEnabled: rubyEnabled(), allowedBlocks: availableMissionBlocks() }; },\n  onAdd: function (type) {\n    if (running) return;\n    editor.addType(type);\n    if (matchMedia('(max-width: 699px)').matches) showMobileView('edit');\n  },\n  onCreate: createNamedItem\n});\n\nconst toolbar = new Toolbar({ onRun: runProject, onStop: function () { stopRun(true); }, onLevel: showLevelDialog, onUndo: undo, onRedo: redo });\n\nnew DragController(document.getElementById('drag-layer'), {\n  onAdd: editor.addType.bind(editor),\n  onMove: editor.moveBefore.bind(editor),\n  onDelete: editor.deleteSelected.bind(editor),\n  onSnap: function () { audio.click(); }\n});\n\nfunction makeScheduler() {\n  const stage = activeStage();\n  interpreter = new Interpreter({\n    project: project, stage: stage, stageName: project.stage, audio: audio, keys: keys,\n    motionDuration: function () { return toolbar.stepsPerFrame <= 1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 0; },\n    ask: function (question) { return dialogs.ask('しつもん', question, ''); },\n    warn: function (code, blockId) {\n      const block = document.querySelector('.blk[data-id=\"' + CSS.escape(String(blockId)) + '\"]');\n      if (block) { block.classList.add('is-error'); setTimeout(function () { block.classList.remove('is-error'); }, 1200); }\n      toast(friendlyError({ code: code }, project.level), true);\n    }\n  });\n  return new Scheduler({\n    project: project, interpreter: interpreter, stage: stage, audio: audio,\n    stepsPerFrame: function () { return toolbar.stepsPerFrame; },\n    onHighlight: function (id) { editor.setRunning(id); },\n    onState: function (value) { running = value; updateToolbar(); },\n    onMonitors: renderMonitors,\n    onDone: function () {\n      running = false;\n      runCompleted = true;\n      updateToolbar();\n      updateMissionProgress();\n      toast(UI.complete);\n    },\n    onStuck: async function () {\n      if (!running || stuckDialogOpen || dialogs.active) return;\n      stuckDialogOpen = true;\n      const currentScheduler = scheduler;\n      const shouldStop = await dialogs.show({\n        title: 'うごきが とまって いるみたい',\n        message: 'このまま つづけますか？ ずっとブロックは、じぶんで とめるまで うごきます。',\n        buttons: [{ label: 'つづける', value: false }, { label: 'とめる', value: true, danger: true }]\n      });\n      stuckDialogOpen = false;\n      if (scheduler !== currentScheduler) return;\n      if (shouldStop && running) stopRun(true);\n      else if (running) activeStage().changedAt = performance.now();\n    },\n    onError: function (error) {\n      const id = error && error.blockId;\n      const block = id ? document.querySelector('.blk[data-id=\"' + CSS.escape(String(id)) + '\"]') : null;\n      if (block) block.classList.add('is-error');\n      toast(friendlyError(error, project.level), true);\n    }\n  });\n}\n\nfunction runProject() {\n  if (running) return;\n  stoppedByUser = false;\n  successPlayed = false;\n  runCompleted = false;\n  if (project.stage === 'field') {\n    running = true; updateToolbar();\n    fieldStage.run(toolbar.stepsPerFrame, updateMissionProgress, (executed = true) => {\n      running = false; runCompleted = executed; updateToolbar(); updateMissionProgress();\n    });\n    updateMissionProgress();\n    return;\n  }\n  activeStage().reset();\n  scheduler = makeScheduler();\n  updateMissionProgress();\n  if (scheduler.start('event_start')) toast(UI.running);\n  else if (project.scripts.some(script => ['event_key', 'event_click'].includes(script.blocks[0]?.type))) toast('キーや キャラを おして はじめよう');\n  else toast('「はじまり」の ブロックを おこう');\n}\n\nfunction triggerProjectEvent(type, detail) {\n  if (project.stage === 'field') return;\n  const hasHat = project.scripts.some(script => script.blocks[0]?.type === type);\n  if (!hasHat) return;\n  if (!scheduler) scheduler = makeScheduler();\n  if (!scheduler.matching(type, detail).length) return;\n  stoppedByUser = false;\n  runCompleted = false;\n  scheduler.trigger(type, detail);\n}\n\nfunction stopRun(showMessage) {\n  stoppedByUser = showMessage;\n  runCompleted = false;\n  if (scheduler) scheduler.stop();\n  if (fieldStage.busy) { fieldStage.stop(); audio.stop(); }\n  scheduler = null; running = false; editor.setRunning(null);\n  if (!showMessage) interpreter = null;\n  if (project.stage === 'device') { Object.keys(deviceStage.outputs).forEach(function (name) { deviceStage.outputs[name] = 0; }); deviceStage.render(); }\n  updateToolbar();\n  updateMissionProgress();\n  if (showMessage) toast(UI.stopped);\n}\n\nfunction discardExecution() {\n  stoppedByUser = false;\n  if (scheduler) scheduler.stop();\n  if (interpreter) activeStage().reset();\n  scheduler = null;\n  interpreter = null;\n  runCompleted = false;\n  successPlayed = false;\n}\n\nfunction undo() {\n  if (running) return;\n  const snapshot = history.undo();\n  if (!snapshot) return;\n  discardExecution();\n  project = snapshot; renderAll();\n}\n\nfunction redo() {\n  if (running) return;\n  const snapshot = history.redo();\n  if (!snapshot) return;\n  discardExecution();\n  project = snapshot; renderAll();\n}\n\nfunction showLevelDialog() {\n  if (levelLocked) return;\n  const content = document.createElement('div'); content.className = 'dialog-list';\n  Object.keys(LEVELS).forEach(function (key) {\n    const level = Number(key); const button = document.createElement('button'); button.type = 'button';\n    const label = document.createElement('strong'); label.textContent = LEVELS[level].button;\n    const note = document.createElement('small'); note.textContent = level === 1 ? 'おおきな ブロック・タップ中心' : level === 2 ? 'もし・へんすうを つかう' : level === 3 ? '算数・理科の ブロック' : level === 4 ? '関数・リスト・JS表示' : 'JSと ブロックを いききする';\n    button.append(label, note);\n    button.addEventListener('click', function () {\n      project.level = level; store.level = level; history.record(project); dialogs.close(true); renderAll();\n    });\n    content.appendChild(button);\n  });\n  dialogs.show({ title: '使える道具をえらぶ', message: '数字を上げると使えるブロックが増えるよ。', content: content, buttons: [{ label: 'とじる', value: false }] });\n}\n\nasync function createNamedItem(category) {\n  if (running) return;\n  let kind = category;\n  if (category === 'data') {\n    kind = await dialogs.show({ title: 'はこを つくる', message: 'かずを 1つ いれる「へんすう」と、いくつも いれる「リスト」が あります。', buttons: [{ label: 'へんすう', value: 'variable', primary: true }, { label: 'リスト', value: 'list' }, { label: 'やめる', value: null }] });\n    if (!kind) return;\n  }\n  const title = kind === 'variable' ? 'へんすうの なまえ' : kind === 'list' ? 'リストの なまえ' : 'じぶんの ブロックの なまえ';\n  const name = await dialogs.ask(title, 'みじかくて わかりやすい なまえに しよう。', kind === 'variable' ? 'かず' : kind === 'list' ? 'きろく' : 'しかく');\n  if (!name) return;\n  if (kind === 'variable') project.vars.push({ id: makeId('v'), name: name, value: 0, show: true });\n  else if (kind === 'list') project.lists.push({ id: makeId('l'), name: name, value: [] });\n  else {\n    const paramsText = await dialogs.ask('ひきすうの なまえ', 'つかう かずや ことばを、カンマで くぎろう。なくても だいじょうぶ。', 'ながさ');\n    const params = String(paramsText || '').split(',').map(function (item) { return item.trim(); }).filter(Boolean).slice(0, 8);\n    project.funcs.push({ id: makeId('f'), name: name, params: params, body: [] });\n    const definition = getDefinition('func_define'); const hat = createBlock('func_define', definition); hat.fields.NAME = name;\n    hat.fields.PARAMS = params.join(', ');\n    project.scripts.push({ id: makeId('s'), x: 40, y: 40, blocks: [hat] });\n  }\n  history.record(project); editor.selectedId = null; renderAll(); toast('「' + name + '」を つくったよ');\n}\n\nfunction activeMission() {\n  const mission = customMission || currentMission;\n  return mission && mission.stage === project.stage ? mission : null;\n}\n\nfunction availableMissionBlocks() {\n  return customMission || activeMission() ? allowedBlocks : null;\n}\n\nfunction updateMissionCard() {\n  const mission = activeMission();\n  document.getElementById('mission-title').textContent = mission ? mission.title : 'じゆうに つくろう';\n  document.getElementById('mission-progress').textContent = mission ? mission.goal : 'ブロックを うごかしてみよう';\n  document.getElementById('mission-hint').textContent = mission?.hints?.[0] || '';\n  document.getElementById('show-example').hidden = !mission?.buildFromBlank || Boolean(customMission);\n  updateMissionProgress();\n}\n\nfunction missionResults() {\n  return evaluateMission(activeMission(), project, activeStage(), runCompleted);\n}\n\nfunction showExample() {\n  const mission = activeMission();\n  if (customMission || !mission?.buildFromBlank) return;\n  const example = getExampleMission(mission.id);\n  if (!example) return;\n  const content = document.createElement('div');\n  content.className = 'mission-example';\n  if (example.stage === 'field') {\n    const steps = document.createElement('ol');\n    const lesson = wo gh = waterLevel(s.time + s.tideOffset) > 0;\n  if (s.position === s.end) {\n    s.delivered = program[3] === 'unload';\n    s.action = s.delivered ? 'delivered' : 'missed';\n    s.ended = true;\n  } else {\n    const condition = reef && (program[0] === 'reefLow' ? !high : high);\n    s.action = rank === 1 ? program[0] : program[condition ? 1 : 2];\n    if (s.action === 'sail') {\n      if (reef && !high) {\n        s.grounded = true;\n        s.ended = true;\n      } else {\n        s.position++;\n        if (reef) s.crossed++;\n        if (s.position === s.end && rank < 3) s.ended = true;\n      }\n    }\n  }\n  s.time++;\n  if (s.time >= s.end * 3 + 3) s.ended = true;\n}\n\nfunction boatStatus(s) {\n  if (s.grounded) return '浅瀬で岩に当たったよ。水が増えるまで待とう。';\n  if (s.delivered) return '島に荷物が届いたよ！';\n  if (s.action === 'missed') return 'さんばしに着いたよ。荷物はまだ船の中だ。';\n  if (s.position === s.end) return '島のさんばしに着いたよ。';\n  if (s.ended) return '航海の時間がおわったよ。進む指令を見直そう。';\n  const tide = waterLevel(s.time + s.tideOffset) > 0 ? '水が多い' : '水が少ない';\n  const next = s.reefs.includes(s.position + 1) ? '次は浅瀬' : '次は深い海';\n  return next + '・' + tide + '　島まであと' + (s.end - s.position) + '区間';\n}\n\nconst roverLessons = [\n  {\n    title: '観測車の 最初のサンプル', goal: '車輪を回して観測の旗まで行き、土を一つ採って記録しよう。',\n    hint: '「基地を出るとき」を「車輪を回す」にしよう。旗に着いたら土を採るよ。',\n    lines: [\n      { label: '基地を出るとき', options: [['park', '基地で止まる'], ['drive', '車輪を回す']], initial: 'park' },\n      { label: '旗に着いたら', options: [sample, pass], initial: 'sample' }\n    ], criteria: ['観測の旗まで走った', '土を採って記録した']\n  },\n  {\n    title: '三つの旗の 観測ノート', goal: '観測車を一周させ、三つの旗の記録を基地に持ち帰ろう。',\n    hint: '旗に着くたびに土を採ろう。三つ目の旗からは、帰り道が基地につながるよ。',\n    lines: [\n      { label: '旗に着くたびに', options: [pass, sample], initial: 'skip' },\n      { label: '三つ目の旗をすぎたら', options: [['stay', '旗で待つ'], ['home', '帰り道で基地へ']], initial: 'home' }\n    ], criteria: ['別々の旗で三つ記録した', '記録を持って基地に帰った']\n  },\n  {\n    title: '電池を守る 帰り道', goal: '出発時の電池がちがう2回の探検で、三つの旗の記録を基地に届けよう。',\n    hint: site-thumb--' + place.area;\n    photo.style.backgroundImage = fieldCover(place.area);\n    const title = document.createElement('h3');\n    title.textContent = place.title;\n    const status = document.createElement('span');\n    const first = campaign.info(place.missions[0]);\n    const repeatId = place.missions[0] + '_blank';\n    const choices = [place.missions[0], repeatId, ...place.missions.slice(1)];\n    const totalCleared = first.completed + Number(campaign.info(repeatId).cleared);\n    renderStampLabel(status, totalCleared + ' / 4 クリア', totalCleared === 4);\n    head.append(photo, title, status);\n    stop.appendChild(head);\n    if (!first.unlocked) {\n      const hint = document.createElement('p');\n      hint.textContent = '🔒 ' + places[index - 1].title + 'の3段階をクリアすると開くよ。';\n      stop.appendChild(hint);\n      const preview = document.createElement('details');\n      const summary = document.createElement('summary'); summary.textContent = '4つのお題をのぞく';\n      const titles = document.createElement('ol');\n      for (const id of choices) {\n        const li = document.createElement('li');\n        li.textContent = '★' + getMission(id).difficulty + ' ' + getMission(id).title + (id === repeatId ? '（白紙版）' : '');\n        titles.appendChild(li);\n      }\n      preview.append(summary, titles); stop.appendChild(preview);\n    } else {\n      for (const id of choices) {\n        const mission = getMission(id), state = campaign.info(id);\n        const choice = document.createElement('button');\n        choice.type = 'button';\n        choice.dataset.mission = id;\n        const restricted = isMissionRestricted(mission, lockedLevel);\n        choice.disabled = !state.unlocked || Boolean(restricted);\n        const status = state.cleared ? 'クリア済み' : restricted ? '先生のレベル設定中' :\n          !state.unlocked ? (state.repeat ? 'お手本で開く' : '前のお題で開く') : currentId === id ? '挑戦中' : '挑戦する';\n        const label = document.createElement('span');\n        label.textContent = '★' + mission.difficulty + ' ' + (state.repeat ? '同じお題を白紙から' : mission.title);\n        if (state.repeat) choice.setAttribute('aria-label', mission.title + '・★2 白紙から・' + status);\n        const badge = document.createElement('small');\n        renderStampLabel(badge, status, state.cleared);\n        if (restricted && state.cleared) {\n          const limit = document.createElement('small');\n          limit.className = 'mission-limit';\n          limit.textContent = '先生のレベル設定中';\n          label.appendChild(limit);\n        }\n        choice.append(label, badge);\n        choice.addEventListener('click', () => start(mission));\n        stop.appendChild(choice);\n      }\n    }\n    list.appendChild(stop);\n  }\n  return list;\n}\n\nexport function showMobileView(view) {\n  const workspace = document.getElementById('workspace');\n  workspace.dataset.view = view;\n  workspace.classList.toggle('mobile-stage', view === 'stage');\n  for (const button of document.querySelectorAll('[data-mobile-view]')) {\n    const active = button.dataset.mobileView === view;\n    button.classList.toggle('is-active', active);\n    button.setAttribute('aria-pressed', String(active));\n  }\n}\n"};
