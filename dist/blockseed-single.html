<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b64">
  <meta name="description" content="つながらなくても使える、段階的なビジュアルプログラミング学習環境">
  <title>ブロックのたね</title>
<style>:root {
  color-scheme: light;
  --ink: #173536;
  --muted: #607474;
  --paper: #fffdf6;
  --paper-2: #f5f7ef;
  --line: #d6ded8;
  --teal: #176b64;
  --teal-dark: #0d4e4a;
  --sun: #f6c744;
  --coral: #e95353;
  --shadow: 0 8px 24px rgba(26, 60, 56, .12);
  --shadow-soft: 0 3px 10px rgba(26, 60, 56, .09);
  --radius: 16px;
  --block-h: 64px;
  --font-scale: 1;
  font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
  font-size: calc(16px * var(--font-scale));
  background: #dcece8;
  color: var(--ink);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body { overflow: hidden; background: radial-gradient(circle at 15% 0%, #eef9f0, transparent 34%), #dcece8; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .43; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 4px solid #1877d2; outline-offset: 2px; }
h1, h2, p { margin: 0; }
h1, h2 { font-size: 1.12rem; line-height: 1.2; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; z-index: 9999; top: 8px; left: 8px; padding: 12px 18px; border-radius: 10px; background: #fff; color: #000; transform: translateY(-150%); }
.skip-link:focus { transform: translateY(0); }
.eyebrow { display: block; margin-bottom: 2px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .08em; }
.icon-btn { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: white; box-shadow: var(--shadow-soft); font-weight: 900; }
.icon-btn:hover { border-color: var(--teal); background: #eefaf6; }
.toast-region { position: fixed; z-index: 300; right: 18px; bottom: 18px; display: grid; gap: 8px; width: min(360px, calc(100vw - 36px)); }
.toast { padding: 14px 16px; border-left: 6px solid var(--teal); border-radius: 12px; background: #fff; box-shadow: var(--shadow); font-weight: 800; animation: toast-in .18s ease-out; }
.toast--error { border-color: var(--coral); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
.dialog-backdrop { position: fixed; z-index: 1000; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(7, 39, 38, .64); backdrop-filter: blur(4px); }
.dialog-card { width: min(480px, 100%); max-height: calc(100vh - 36px); max-height: min(760px, calc(100dvh - 36px)); overflow: auto; padding: 22px; border: 2px solid rgba(255,255,255,.65); border-radius: 22px; background: var(--paper); box-shadow: 0 22px 70px rgba(0,0,0,.3); }
.dialog-card--wide { width: min(780px, 100%); }
.dialog-card h2 { margin-bottom: 12px; font-size: 1.35rem; }
.dialog-message { margin-bottom: 14px; color: var(--muted); line-height: 1.65; }
.dialog-input, .dialog-card textarea, .dialog-card select { width: 100%; min-height: 48px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
.dialog-card textarea { min-height: 110px; resize: vertical; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.dialog-actions button, .dialog-content button { min-height: 44px; padding: 0 15px; border: 1px solid var(--line); border-radius: 11px; background: #fff; font-weight: 900; }
.dialog-actions .is-primary, .dialog-content .is-primary { border-color: var(--teal); background: var(--teal); color: #fff; }
.dialog-actions .is-danger { border-color: #ad2635; background: #ad2635; color: #fff; }
.dialog-section { display: grid; gap: 9px; padding: 13px 0; border-top: 1px solid var(--line); }
.dialog-section:first-child { border-top: 0; }
.dialog-section h3 { margin: 0; font-size: 1rem; }
.dialog-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dialog-list { display: grid; gap: 8px; }
.dialog-list button { display: grid; grid-template-columns: 1fr auto; gap: 5px; height: auto; padding: 10px 12px; text-align: left; }
.dialog-list button small { color: var(--muted); font-weight: 700; }
.dialog-field { display: grid; gap: 4px; font-weight: 800; }
.dialog-field span { font-size: .8rem; color: var(--muted); }
.dialog-check { display: flex; align-items: center; gap: 7px; min-height: 44px; font-weight: 800; }
.dialog-check input { width: 22px; height: 22px; accent-color: var(--teal); }
.check-list { display: grid; gap: 7px; margin: 12px 0 0; padding: 0; list-style: none; }
.check-list li { padding: 8px 10px; border-radius: 9px; background: #f0f1ed; }
.check-list li.is-done { background: #dff3df; color: #1d642b; }
.number-pad-backdrop { position: fixed; z-index: 1100; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(7,39,38,.55); }
.number-pad { width: min(330px, 100%); padding: 14px; border-radius: 20px; background: var(--paper); box-shadow: 0 22px 70px rgba(0,0,0,.3); }
.number-pad__readout { display: block; min-height: 58px; margin-bottom: 10px; padding: 8px 14px; overflow: hidden; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-size: 1.55rem; font-weight: 900; text-align: right; }
.number-pad__keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.number-pad__keys button { min-height: 52px; border: 1px solid var(--line); border-radius: 11px; background: #fff; font-weight: 900; }
.number-pad__keys .is-primary { border-color: var(--teal); background: var(--teal); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

:root {
  --cat-event: #c99a18;
  --cat-motion: #1672b8;
  --cat-looks: #8255b5;
  --cat-sound: #bd3e78;
  --cat-control: #d66b19;
  --cat-sensing: #1688a3;
  --cat-device: #34843d;
  --cat-operators: #668d22;
  --cat-data: #bd5720;
  --cat-function: #9b356e;
}
.palette-list { display: grid; gap: 10px; align-content: start; }
.palette-create { min-height: 48px; padding: 8px 10px; border: 2px dashed var(--teal); border-radius: 12px; background: #effaf6; color: var(--teal-dark); font-weight: 900; }
.blk { --blk-color: #687b7c; position: relative; min-height: var(--block-h); padding: 12px 13px; border: 0; border-bottom: 4px solid rgba(0,0,0,.24); border-radius: 12px; background: var(--blk-color); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.2); font-weight: 900; line-height: 1.35; box-shadow: 0 3px 8px rgba(26,45,48,.19); touch-action: none; user-select: none; }
.blk::before { content: ""; position: absolute; z-index: 1; top: -1px; left: 19px; width: 26px; height: 7px; border-radius: 0 0 7px 7px; background: rgba(255,255,255,.92); opacity: .9; }
.blk--hat { border-radius: 25px 12px 12px 12px; }
.blk--hat::before, .blk--value::before, .blk--bool::before { display: none; }
.blk--value { display: inline-flex; min-height: 44px; border-radius: 24px; }
.blk--bool { display: inline-flex; min-height: 44px; border-radius: 8px 22px; }
.blk--c { padding: 0; background: transparent; border: 0; box-shadow: none; }
.blk--c > .blk-band { padding: 12px 13px; border-radius: 12px 12px 8px 8px; background: var(--blk-color); box-shadow: 0 3px 8px rgba(26,45,48,.18); }
.blk--c > .blk-band::before { content: ""; display: inline-block; width: 20px; height: 7px; margin-right: 4px; border-radius: 0 0 7px 7px; background: rgba(255,255,255,.9); vertical-align: top; }
.blk-body { min-height: 44px; margin-left: 20px; padding: 8px 0 8px 10px; border-left: 14px solid var(--blk-color); background: rgba(255,255,255,.73); }
.blk-foot { height: 18px; margin-left: 0; border-radius: 0 0 12px 12px; background: var(--blk-color); }
.blk.is-selected { outline: 5px solid #133b7a; outline-offset: 3px; }
.blk.is-running { filter: brightness(1.18) saturate(1.15); outline: 5px solid #ffe15a; outline-offset: 3px; }
.blk.is-error { animation: error-pulse .5s 2; outline: 5px solid #df2435; }
.blk--unknown { filter: grayscale(1); }
.blk-category-event { --blk-color: var(--cat-event); }
.blk-category-motion { --blk-color: var(--cat-motion); }
.blk-category-looks { --blk-color: var(--cat-looks); }
.blk-category-sound { --blk-color: var(--cat-sound); }
.blk-category-control { --blk-color: var(--cat-control); }
.blk-category-sensing { --blk-color: var(--cat-sensing); }
.blk-category-device { --blk-color: var(--cat-device); }
.blk-category-operators { --blk-color: var(--cat-operators); }
.blk-category-data { --blk-color: var(--cat-data); }
.blk-category-function { --blk-color: var(--cat-function); }
.blk-label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; pointer-events: auto; }
.blk-input { display: inline-flex; align-items: center; gap: 2px; min-height: 34px; padding: 2px 4px; border: 2px solid rgba(0,0,0,.13); border-radius: 17px; background: #fff; color: #173536; text-shadow: none; }
.blk-input input, .blk-input select { width: 64px; min-height: 28px; padding: 0 5px; border: 0; border-radius: 12px; background: #fff; text-align: center; font-weight: 900; }
.blk-input select { width: auto; max-width: 110px; }
.blk-input--static { min-height: 30px; pointer-events: none; }
.blk-static { display: grid; place-items: center; min-width: 30px; min-height: 26px; padding: 0 5px; }
.blk-static--color { min-width: 24px; width: 24px; min-height: 24px; padding: 0; border: 3px solid #fff; border-radius: 50%; background: var(--chip-color); box-shadow: 0 0 0 1px #50615f; }
.blk-number { display: grid; place-items: center; min-width: 32px; min-height: 28px; cursor: pointer; }
.blk-step { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: #eaf0ec; font-weight: 900; }
.blk-color { width: 28px; height: 28px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #50615f; }
.script-stack { position: relative; display: grid; gap: 4px; width: min(100%, 390px); }
.script-stack > .blk { width: 100%; }
.palette .blk { width: 100%; min-height: 52px; padding: 10px; font-size: .85rem; text-align: left; }
.palette .blk::after { content: "+"; position: absolute; top: 50%; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.22); transform: translateY(-50%); }
.drop-marker { height: 12px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 3px #23665e, 0 4px 10px rgba(0,0,0,.18); }
.blk-body__hint { display: block; padding: 7px; border: 2px dashed rgba(23,53,54,.24); border-radius: 8px; color: #6e7d78; text-shadow: none; font-size: .72rem; }
.blk--inline { display: inline-flex; width: auto !important; min-height: 36px !important; padding: 6px 9px !important; border-width: 2px; font-size: .8rem !important; vertical-align: middle; }
@keyframes error-pulse { 50% { filter: brightness(1.4); } }

.app-shell { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; min-height: 600px; padding: 10px; gap: 10px; }
.toolbar { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 10px; border: 1px solid rgba(23, 107, 100, .16); border-radius: 18px; background: rgba(255,255,255,.94); box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 10px 4px 4px; border: 0; background: transparent; font-weight: 900; color: var(--teal-dark); }
.brand__mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: #def2d5; font-size: 1.55rem; transform: rotate(-3deg); }
.brand__text { white-space: nowrap; }
.toolbar__primary, .toolbar__group { display: flex; align-items: center; gap: 7px; }
.toolbar__primary { margin-left: 4px; }
.toolbar__group { padding-left: 10px; border-left: 1px solid var(--line); }
.toolbar__more { margin-left: auto; }
.tool-btn { min-height: 44px; padding: 0 15px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-soft); font-weight: 900; }
.tool-btn--run { border-color: #147660; background: var(--teal); color: #fff; }
.tool-btn--run:hover { background: var(--teal-dark); }
.tool-btn--stop { border-color: #b83f43; background: #fff3f1; color: #a32d36; }
.tool-btn--level { border-color: #d5a72c; background: #fff7d7; }
.toolbar__speed label { font-size: .78rem; font-weight: 800; color: var(--muted); }
.toolbar select { min-height: 40px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 800; }
.workspace { display: grid; grid-template-columns: minmax(216px, .72fr) minmax(320px, 1.14fr) minmax(360px, 1.28fr); gap: 10px; min-height: 0; }
.panel { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(23, 107, 100, .16); border-radius: var(--radius); background: rgba(255,255,255,.92); box-shadow: var(--shadow); }
.panel__heading { display: flex; align-items: center; justify-content: space-between; min-height: 66px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.palette-panel { display: grid; grid-template-rows: auto auto auto 1fr; }
.palette { overflow: auto; padding: 12px; overscroll-behavior: contain; }
.search-field { padding: 8px 12px 0; }
.search-field input { width: 100%; min-height: 44px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
.category-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px 10px 4px; }
.category-tab { min-height: 46px; padding: 4px; border: 2px solid transparent; border-radius: 11px; background: #edf3f0; color: #365352; font-size: .78rem; font-weight: 900; }
.category-tab .cat-icon { display: block; font-size: 1.05rem; }
.category-tab[aria-selected="true"] { border-color: var(--teal); background: #dff3ec; color: var(--teal-dark); }
.editor-panel { display: grid; grid-template-rows: auto 1fr auto; background: #f4f7f3; }
.editor-heading { background: rgba(255,255,255,.85); }
#project-name { min-width: 7rem; max-width: 22rem; padding: 3px 5px; border-radius: 7px; }
#project-name:focus { background: #fff9cf; }
.edit-actions { display: flex; gap: 5px; }
.edit-actions button, .insert-mode button { min-width: 44px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 900; }
.script-canvas { position: relative; overflow: auto; min-height: 280px; padding: 22px; background-color: #f3f7f3; background-image: radial-gradient(#c5d5cc 1px, transparent 1px); background-size: 20px 20px; overscroll-behavior: contain; }
.scripts { display: grid; gap: 24px; align-items: start; }
.empty-hint { position: absolute; inset: 40% 20px auto; color: #6d7f7b; text-align: center; font-weight: 800; }
.empty-hint span { display: inline-block; margin-right: 6px; font-size: 1.6rem; }
.insert-mode { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px; border-top: 1px solid var(--line); background: #fffbe8; font-size: .82rem; font-weight: 800; }
.insert-mode button.is-active { border-color: var(--teal); background: #dff3ec; }
.stage-panel { display: grid; grid-template-rows: auto auto minmax(240px, 1fr) auto; background: #fffdf7; }
.stage-heading { display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.stage-tabs { display: flex; gap: 5px; }
.stage-tab { min-height: 42px; padding: 0 12px; border: 1px solid transparent; border-radius: 11px; background: transparent; font-weight: 900; color: var(--muted); }
.stage-tab.is-active { border-color: var(--line); background: #fff; color: var(--teal-dark); box-shadow: var(--shadow-soft); }
.stage-tools { display: flex; gap: 5px; }
.mission-card { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 9px 10px 0; padding: 9px 10px; border: 1px solid #e6d592; border-radius: 13px; background: #fff8d8; }
.mission-card__icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--sun); font-size: 1.15rem; font-weight: 900; }
.mission-card__copy { display: grid; min-width: 0; }
.mission-card__kicker, #mission-progress { color: #6d674d; font-size: .7rem; }
#mission-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.mission-card button { min-height: 38px; padding: 0 10px; border: 1px solid #c6a52f; border-radius: 9px; background: #fff; font-weight: 800; }
.stage { display: grid; min-height: 0; padding: 10px; }
.stage-view { display: none; position: relative; place-items: center; min-height: 0; overflow: hidden; border: 2px solid #d7dfd8; border-radius: 14px; background: #fff; }
.stage-view.is-active { display: grid; }
.stage-view canvas { position: absolute; width: 100%; height: 100%; object-fit: contain; touch-action: none; }
.sprite-controls { position: absolute; z-index: 2; top: 8px; right: 8px; display: flex; gap: 5px; padding: 5px; border: 1px solid rgba(23,53,54,.15); border-radius: 11px; background: rgba(255,255,255,.9); box-shadow: var(--shadow-soft); }
.sprite-controls button, .sprite-controls select { min-height: 44px; padding: 0 9px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: .75rem; font-weight: 900; }
.monitors { display: flex; gap: 8px; min-height: 0; padding: 0 10px 10px; overflow-x: auto; }
.monitor { flex: 0 0 auto; padding: 5px 9px; border-radius: 8px; background: #fff0d2; font-size: .76rem; font-weight: 800; }
.mobile-tabs { display: none; }
.drag-layer { position: fixed; z-index: 500; inset: 0; pointer-events: none; }
.drag-ghost { position: fixed !important; top: 0; left: 0; z-index: 501; margin: 0; opacity: .9; transform-origin: top left; filter: drop-shadow(0 12px 18px rgba(0,0,0,.27)); }
.blk.is-drop-target { outline: 5px solid #fff; box-shadow: 0 0 0 9px var(--teal), var(--shadow); }
.code-panel { max-height: 46%; min-height: 190px; border-top: 2px solid var(--line); background: #112b2c; color: #eaf6ef; }
.code-panel__heading { display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 5px 8px 5px 13px; }
.code-panel__heading div { display: flex; gap: 5px; }
.code-panel button { min-height: 36px; padding: 0 9px; border: 1px solid #567071; border-radius: 8px; background: #213f40; color: #fff; font-size: .72rem; font-weight: 800; }
.code-panel textarea { display: block; width: 100%; height: 120px; resize: vertical; padding: 11px 13px; border: 0; border-top: 1px solid #3f5a5b; background: #0b2021; color: #d8f4e7; font: 14px/1.55 ui-monospace, Consolas, monospace; tab-size: 2; }
.code-message { display: block; min-height: 24px; padding: 3px 10px; color: #ffd879; font-size: .72rem; }
.editor-panel.has-code { grid-template-rows: auto minmax(220px, 1fr) auto auto; }
.device-stage { overflow: auto; padding: 12px; background: #f3f7f4; }
.device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; height: 100%; align-content: start; }
.device-card { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: var(--shadow-soft); }
.device-card h3 { margin: 0 0 10px; font-size: .86rem; }
.sensor-row { display: grid; grid-template-columns: 64px 1fr 34px; gap: 6px; align-items: center; min-height: 38px; font-size: .76rem; font-weight: 800; }
.sensor-row input { width: 100%; accent-color: var(--teal); }
.sensor-row button { min-height: 44px; padding: 0 8px; border: 1px solid var(--line); border-radius: 9px; background: #eef5f1; font-size: .72rem; font-weight: 900; }
.sensor-row button[aria-pressed="true"] { border-color: var(--teal); background: var(--teal); color: #fff; }
.sensor-row output { font-variant-numeric: tabular-nums; text-align: right; }
.device-actions { margin-top: 8px; }
.device-actions button, .device-meter button { min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: #eef5f1; font-weight: 800; }
.device-actions button.is-active { border-color: var(--teal); background: var(--teal); color: #fff; }
.output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.output-item { display: grid; grid-template-columns: auto 1fr; gap: 0 7px; align-items: center; min-height: 59px; padding: 7px; border: 2px solid #dfe5e0; border-radius: 11px; background: #f7f8f5; }
.output-icon { grid-row: 1 / 3; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #e4e8e4; font-size: 1.2rem; }
.output-item strong { font-size: .76rem; }
.output-value { color: var(--muted); font-size: .68rem; }
.output-item.is-on { border-color: #e2a923; background: #fff9d9; }
.output-item.is-on .output-icon { background: var(--lamp, #ffbd31); color: #6b4b00; box-shadow: 0 0 18px var(--lamp, #ffbd31); }
.output-item[data-output="motor"].is-on .output-icon { animation: motor-spin .8s linear infinite; }
.output-item[data-output="heater"].is-on .output-icon { background: #e95b4f; color: #fff; box-shadow: 0 0 18px #e95b4f; }
.device-meter { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; align-items: center; }
.device-meter h3 { grid-column: 1 / -1; margin: 0; }
.use-time { font-size: 1.35rem; color: var(--teal-dark); }
.energy-score { color: var(--teal-dark); font-size: .78rem; font-weight: 900; }
.energy-bar { grid-column: 1 / -1; height: 11px; overflow: hidden; border-radius: 6px; background: #e1e7e2; }
.energy-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #45a957, #f6c744, #df594f); transition: width .2s; }
.record-list { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.record-list span { padding: 5px 8px; border-radius: 7px; background: #eef4ee; font-size: .7rem; font-weight: 800; }
@keyframes motor-spin { to { transform: rotate(360deg); } }

@media (max-width: 1180px) {
  .brand__text, .toolbar__speed label, #tidy-btn { display: none; }
  .workspace { grid-template-columns: 220px minmax(310px, 1fr) minmax(330px, 1fr); }
}

@media (max-width: 1023px) {
  body { overflow: auto; }
  .app-shell { height: auto; min-height: 100vh; min-height: 100dvh; grid-template-rows: auto 1fr; }
  .workspace { grid-template-columns: 230px 1fr; grid-template-rows: minmax(370px, 44vh) minmax(480px, 1fr); }
  .stage-panel { grid-column: 1 / -1; grid-row: 1; }
  .palette-panel { grid-column: 1; grid-row: 2; }
  .editor-panel { grid-column: 2; grid-row: 2; }
}

@media (max-width: 699px) {
  body { overflow: hidden; }
  .app-shell { height: 100vh; height: 100dvh; min-height: 0; gap: 7px; padding: 7px; grid-template-rows: auto auto minmax(0, 1fr); }
  .toolbar { flex-wrap: nowrap; min-height: 58px; gap: 6px; padding: 6px; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }
  .toolbar > * { flex: 0 0 auto; }
  .brand { padding-right: 2px; }
  .brand__mark { width: 40px; height: 40px; }
  .toolbar__primary { margin: 0; }
  .toolbar__group { padding-left: 0; border: 0; }
  .toolbar__speed { display: flex; }
  .toolbar__more #save-btn { display: inline-block; }
  .toolbar__more #help-btn, .toolbar__more #tidy-btn { display: inline-grid; }
  .toolbar__more { margin-left: 0; }
  .tool-btn { padding: 0 10px; }
  .mobile-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; border-radius: 13px; background: rgba(255,255,255,.85); }
  .mobile-tab { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 900; }
  .mobile-tab.is-active { background: var(--teal); color: #fff; }
  .workspace { display: block; height: 100%; min-height: 0; overflow: hidden; }
  .stage-panel, .palette-panel, .editor-panel { height: 100%; min-height: 0; }
  .stage-panel { display: none; }
  .workspace.mobile-stage .stage-panel { display: grid; }
  .workspace.mobile-stage .palette-panel, .workspace.mobile-stage .editor-panel { display: none; }
  .workspace:not(.mobile-stage) { display: grid; grid-template-columns: 132px 1fr; grid-template-rows: minmax(0, 1fr); }
  .workspace:not(.mobile-stage) .palette-panel { display: grid; grid-row: 1; }
  .workspace:not(.mobile-stage) .editor-panel { display: grid; grid-row: 1; }
  .category-tabs { grid-template-columns: repeat(2, 1fr); padding: 6px; }
  .category-tab { min-height: 54px; font-size: .68rem; }
  .palette { padding: 7px; }
  .panel__heading { padding: 8px; }
  .palette-panel .panel__heading h1, .palette-panel .eyebrow, .palette-search-toggle { display: none; }
  .palette-panel .panel__heading { min-height: 10px; padding: 3px; }
  .script-canvas { padding: 12px 8px; }
  .mission-card { margin-top: 5px; }
  .device-grid { grid-template-columns: 1fr; }
  .device-meter { grid-column: auto; }
}

.level-1 { --block-h: 64px; }
.level-2 { --block-h: 52px; }
.level-3, .level-4, .level-5 { --block-h: 44px; }
.level-1 .blk { font-size: 1rem; }
.level-1 .palette .blk { min-height: 60px; }
.level-1 button, .level-1 select { min-height: 48px; }
.level-3 .palette-search-toggle, .level-4 .palette-search-toggle, .level-5 .palette-search-toggle { display: inline-grid; }
.level-1 .palette-search-toggle, .level-2 .palette-search-toggle { display: none; }
.font-large { --font-scale: 1.14; }
.font-xlarge { --font-scale: 1.3; }
ruby rt { font-size: .55em; }

@page { margin: 12mm; }
body { overflow: visible; background: #fff; }
.toolbar, .palette-panel, .stage-panel, .mobile-tabs, .edit-actions, .insert-mode { display: none !important; }
.app-shell, .workspace, .editor-panel, .script-canvas { display: block; height: auto; overflow: visible; border: 0; box-shadow: none; background: #fff; }
.panel__heading { border: 0; padding: 0 0 10mm; }
.blk { break-inside: avoid; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
.print-sheet { display: none; color: #173536; }
body[data-print-mode="cards"] .app-shell, body[data-print-mode="worksheet"] .app-shell { display: none !important; }
body[data-print-mode="cards"] .print-sheet, body[data-print-mode="worksheet"] .print-sheet { display: block; }
.print-sheet h1 { margin: 0 0 8mm; font-size: 20pt; }
.print-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; align-items: start; }

.worksheet-goal { padding: 5mm; border: 2px solid #176b64; border-radius: 4mm; font-size: 15pt; }

.worksheet-space { min-height: 120mm; padding: 7mm; border: 2px dashed #78908c; border-radius: 4mm; color: #607474; }
.worksheet-reflection { min-height: 42mm; margin-top: 8mm; padding: 7mm; border: 2px solid #78908c; border-radius: 4mm; }

        <button id="redo-btn" class="icon-btn" type="button" title="やりなおす" aria-label="やりなおす" disabled>↷</button>

      <div class="toolbar__group toolbar__more">

    <main id="workspace" class="workspace" tabindex="-1">

imer = setTimeout(() => { this.timers.delete(timer); run(); }, milliseconds);\n    this.timers.add(timer);\n  }\n\n  ensure() {\n    if (this.muted) return null;\n    if (!this.context) {\n      const Context = window.AudioContext || window.webkitAudioContext;\n      if (!Context) return null;\n      this.context = new Context();\n    }\n    if (this.context.state === 'suspended') this.context.resume();\n    return this.context;\n  }\n\n  tone(midi, seconds, wave) {\n    const context = this.ensure(); if (!context) return;\n    const oscillator = context.createOscillator(); const gain = context.createGain();\n    oscillator.type = wave || 'sine';\n    oscillator.frequency.value = 440 * Math.pow(2, (Number(midi) - 69) / 12);\n    gain.gain.setValueAtTime(.0001, context.currentTime);\n    gain.gain.exponentialRampToValueAtTime(.18, context.currentTime + .015);\n    gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + Math.max(.05, Number(seconds) || .2));\n    oscillator.connect(gain); gain.connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + Math.max(.06, Number(seconds) || .2) + .03);\n    this.nodes.add(oscillator); oscillator.onended = () => this.nodes.delete(oscillator);\n  }\n\n  effect(name) {\n    const beat = 100 / this.tempo;\n    if (name === 'boo') this.tone(38, .45, 'sawtooth');\n    else if (name === 'success') { this.tone(60, .2); this.later(() => this.tone(64, .2), 100 * beat); this.later(() => this.tone(67, .35), 200 * beat); }\n    else if (name === 'clap') { this.tone(72, .05, 'square'); this.later(() => this.tone(76, .05, 'square'), 80 * beat); }\n    else this.tone(84, .12, 'square');\n  }\n\n  click() { this.tone(80, .035, 'sine'); }\n  stop() { this.nodes.forEach(function (node) { try { node.stop(); } catch (error) { /* already stopped */ } }); this.nodes.clear(); this.timers.forEach(function (timer) { clearTimeout(timer); }); this.timers.clear(); }\n}\n"};
  const urls = {};
  function normalize(parent, child) {
    const parts = parent.split('/'); parts.pop();

      return lead + quote + make(normalize(name, spec)) + quote;
