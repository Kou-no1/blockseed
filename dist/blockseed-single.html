  <style>:root {
  color-scheme: light;
  --ink: #173536;
  --muted: #607474;
  --paper: #fffdf6;
  --paper-2: #f5f7ef;
  --line: #d6ded8;
  --teal: #176b64;
  --teal-dark: #0d4e4a;
  --sun: #f6c744;
  --coral: #e95353;
  --shadow: 0 8px 24px rgba(26, 60, 56, .12);
  --shadow-soft: 0 3px 10px rgba(26, 60, 56, .09);
  --radius: 16px;
  --block-h: 64px;
  --font-scale: 1;
  font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
  font-size: calc(16px * var(--font-scale));
  background: #dcece8;
  color: var(--ink);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body { overflow: hidden; background: radial-gradient(circle at 15% 0%, #eef9f0, transparent 34%), #dcece8; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .43; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 4px solid #1877d2; outline-offset: 2px; }
h1, h2, p { margin: 0; }
h1, h2 { font-size: 1.12rem; line-height: 1.2; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.skip-link:focus { transform: translateY(0); }

.icon-btn { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: white; box-shadow: var(--shadow-soft); font-weight: 900; }
.icon-btn:hover { border-color: var(--teal); background: #eefaf6; }

.toast { padding: 14px 16px; border-left: 6px solid var(--teal); border-radius: 12px; background: #fff; box-shadow: var(--shadow); font-weight: 800; animation: toast-in .18s ease-out; }
.toast--error { border-color: var(--coral); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
.dialog-backdrop { position: fixed; z-index: 1000; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(7, 39, 38, .64); backdrop-filter: blur(4px); }
.dialog-card { width: min(480px, 100%); max-height: calc(100vh - 36px); max-height: min(760px, calc(100dvh - 36px)); overflow: auto; padding: 22px; border: 2px solid rgba(255,255,255,.65); border-radius: 22px; background: var(--paper); box-shadow: 0 22px 70px rgba(0,0,0,.3); }
.dialog-card--wide { width: min(780px, 100%); }
.dialog-card h2 { margin-bottom: 12px; font-size: 1.35rem; }
.dialog-message { margin-bottom: 14px; color: var(--muted); line-height: 1.65; }
.dialog-input, .dialog-card textarea, .dialog-card select { width: 100%; min-height: 48px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
.dialog-card textarea { min-height: 110px; resize: vertical; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.dialog-actions button, .dialog-content button { min-height: 44px; padding: 0 15px; border: 1px solid var(--line); border-radius: 11px; background: #fff; font-weight: 900; }
.dialog-actions .is-primary, .dialog-content .is-primary { border-color: var(--teal); background: var(--teal); color: #fff; }
.dialog-actions .is-danger { border-color: #ad2635; background: #ad2635; color: #fff; }
.dialog-section { display: grid; gap: 9px; padding: 13px 0; border-top: 1px solid var(--line); }
.dialog-section:first-child { border-top: 0; }
.dialog-section h3 { margin: 0; font-size: 1rem; }
.dialog-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dialog-list { display: grid; gap: 8px; }
.dialog-list button { display: grid; grid-template-columns: 1fr auto; gap: 5px; height: auto; padding: 10px 12px; text-align: left; }
.dialog-list button small { color: var(--muted); font-weight: 700; }
.dialog-field { display: grid; gap: 4px; font-weight: 800; }
.dialog-field span { font-size: .8rem; color: var(--muted); }
.dialog-check { display: flex; align-items: center; gap: 7px; min-height: 44px; font-weight: 800; }
.dialog-check input { width: 22px; height: 22px; accent-color: var(--teal); }
.check-list { display: grid; gap: 7px; margin: 12px 0 0; padding: 0; list-style: none; }
.check-list li { padding: 8px 10px; border-radius: 9px; background: #f0f1ed; }
.check-list li.is-done { background: #dff3df; color: #1d642b; }
.number-pad-backdrop { position: fixed; z-index: 1100; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(7,39,38,.55); }
.number-pad { width: min(330px, 100%); padding: 14px; border-radius: 20px; background: var(--paper); box-shadow: 0 22px 70px rgba(0,0,0,.3); }
.number-pad__readout { display: block; min-height: 58px; margin-bottom: 10px; padding: 8px 14px; overflow: hidden; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-size: 1.55rem; font-weight: 900; text-align: right; }
.number-pad__keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.number-pad__keys button { min-height: 52px; border: 1px solid var(--line); border-radius: 11px; background: #fff; font-weight: 900; }
.number-pad__keys .is-primary { border-color: var(--teal); background: var(--teal); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
  <style>:root {
  --cat-event: #c99a18;
  --cat-motion: #1672b8;
  --cat-looks: #8255b5;
  --cat-sound: #bd3e78;
  --cat-control: #d66b19;
  --cat-sensing: #1688a3;
  --cat-device: #34843d;
  --cat-operators: #668d22;

  --cat-function: #9b356e;
}
.palette-list { display: grid; gap: 10px; align-content: start; }
.palette-create { min-height: 48px; padding: 8px 10px; border: 2px dashed var(--teal); border-radius: 12px; background: #effaf6; color: var(--teal-dark); font-weight: 900; }
.blk { --blk-color: #687b7c; position: relative; min-height: var(--block-h); padding: 12px 13px; border: 0; border-bottom: 4px solid rgba(0,0,0,.24); border-radius: 12px; background: var(--blk-color); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.2); font-weight: 900; line-height: 1.35; box-shadow: 0 3px 8px rgba(26,45,48,.19); touch-action: none; user-select: none; }
.blk::before { content: ""; position: absolute; z-index: 1; top: -1px; left: 19px; width: 26px; height: 7px; border-radius: 0 0 7px 7px; background: rgba(255,255,255,.92); opacity: .9; }
.blk--hat { border-radius: 25px 12px 12px 12px; }
.blk--hat::before, .blk--value::before, .blk--bool::before { display: none; }
.blk--value { display: inline-flex; min-height: 44px; border-radius: 24px; }
.blk--bool { display: inline-flex; min-height: 44px; border-radius: 8px 22px; }
.blk--c { padding: 0; background: transparent; border: 0; box-shadow: none; }
.blk--c > .blk-band { padding: 12px 13px; border-radius: 12px 12px 8px 8px; background: var(--blk-color); box-shadow: 0 3px 8px rgba(26,45,48,.18); }
.blk--c > .blk-band::before { content: ""; display: inline-block; width: 20px; height: 7px; margin-right: 4px; border-radius: 0 0 7px 7px; background: rgba(255,255,255,.9); vertical-align: top; }
.blk-body { min-height: 44px; margin-left: 20px; padding: 8px 0 8px 10px; border-left: 14px solid var(--blk-color); background: rgba(255,255,255,.73); }
.blk-foot { height: 18px; margin-left: 0; border-radius: 0 0 12px 12px; background: var(--blk-color); }
.blk.is-selected { outline: 5px solid #133b7a; outline-offset: 3px; }
.blk.is-running { filter: brightness(1.18) saturate(1.15); outline: 5px solid #ffe15a; outline-offset: 3px; }
.blk.is-error { animation: error-pulse .5s 2; outline: 5px solid #df2435; }
.blk--unknown { filter: grayscale(1); }
.blk-category-event { --blk-color: var(--cat-event); }
.blk-category-motion { --blk-color: var(--cat-motion); }
.blk-category-looks { --blk-color: var(--cat-looks); }
.blk-category-sound { --blk-color: var(--cat-sound); }
.blk-category-control { --blk-color: var(--cat-control); }
.blk-category-sensing { --blk-color: var(--cat-sensing); }
.blk-category-device { --blk-color: var(--cat-device); }
.blk-category-operators { --blk-color: var(--cat-operators); }
.blk-category-data { --blk-color: var(--cat-data); }
.blk-category-function { --blk-color: var(--cat-function); }
.blk-label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; pointer-events: auto; }
.blk-input { display: inline-flex; align-items: center; gap: 2px; min-height: 34px; padding: 2px 4px; border: 2px solid rgba(0,0,0,.13); border-radius: 17px; background: #fff; color: #173536; text-shadow: none; }
.blk-input input, .blk-input select { width: 64px; min-height: 28px; padding: 0 5px; border: 0; border-radius: 12px; background: #fff; text-align: center; font-weight: 900; }
.blk-input select { width: auto; max-width: 110px; }
.blk-input--static { min-height: 30px; pointer-events: none; }
.blk-static { display: grid; place-items: center; min-width: 30px; min-height: 26px; padding: 0 5px; }
.blk-static--color { min-width: 24px; width: 24px; min-height: 24px; padding: 0; border: 3px solid #fff; border-radius: 50%; background: var(--chip-color); box-shadow: 0 0 0 1px #50615f; }
.blk-number { display: grid; place-items: center; min-width: 32px; min-height: 28px; cursor: pointer; }
.blk-step { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: #eaf0ec; font-weight: 900; }
.blk-color { width: 28px; height: 28px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #50615f; }
.script-stack { position: relative; display: grid; gap: 4px; width: min(100%, 390px); }
.script-stack > .blk { width: 100%; }
.palette .blk { width: 100%; min-height: 52px; padding: 10px; font-size: .85rem; text-align: left; }
.palette .blk::after { content: "+"; position: absolute; top: 50%; right: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.22); transform: translateY(-50%); }
.drop-marker { height: 12px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 3px #23665e, 0 4px 10px rgba(0,0,0,.18); }
.blk-body__hint { display: block; padding: 7px; border: 2px dashed rgba(23,53,54,.24); border-radius: 8px; color: #6e7d78; text-shadow: none; font-size: .72rem; }
.blk--inline { display: inline-flex; width: auto !important; min-height: 36px !important; padding: 6px 9px !important; border-width: 2px; font-size: .8rem !important; vertical-align: middle; }
@keyframes error-pulse { 50% { filter: brightness(1.4); } }
</style>
  <style>.app-shell { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; min-height: 600px; padding: 10px; gap: 10px; }
.toolbar { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 10px; border: 1px solid rgba(23, 107, 100, .16); border-radius: 18px; background: rgba(255,255,255,.94); box-shadow: var(--shadow); }

.panel { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(23, 107, 100, .16); border-radius: var(--radius); background: rgba(255,255,255,.92); box-shadow: var(--shadow); }

.energy-score { color: var(--teal-dark); font-size: .78rem; font-weight: 900; }

  <style>/* Field Atlas: compact instruments around a large, readable map and script. */
:root {
  --ink: #213d34; --muted: #506459; --line: #d7ddd3; --teal: #215640;
  --teal-dark: #193f32; --paper: #fffef9; --radius: 12px;
  --shadow: none; --shadow-soft: none;
  --cat-event: #946419; --cat-motion: #317285; --cat-looks: #70548c;
  --cat-sound: #a14972; --cat-control: #a95029; --cat-sensing: #357b77;
  --cat-device: #507446; --cat-operators: #69722e;
  background: #f4f5ef;
}
body { background: #f4f5ef; overflow: auto; }
.app-shell { display: flex; flex-direction: column; width: min(100%, 1740px); height: auto; min-height: 100dvh; margin: auto; padding: 0 clamp(14px, 2.8vw, 52px) 24px; gap: 0; }
.masthead { display: flex; align-items: center; min-height: 75px; gap: clamp(18px, 4vw, 72px); }
.brand { display: inline-flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; color: var(--ink); }
.atlas-logo { width: 40px; height: 40px; flex-shrink: 0; }
.brand__words { display: grid; text-align: left; }
.brand__words strong { font-size: 1.12rem; line-height: 1.35; letter-spacing: .04em; }
.brand__words small { font: 700 .65rem/1.4 ui-monospace, Consolas, monospace; letter-spacing: .23em; color: var(--muted); }
.atlas-nav, .mast-actions, .lab-title { display: flex; align-items: center; }
.atlas-nav { align-self: stretch; gap: 24px; }
.atlas-nav :is(a,button) { display: grid; place-items: center; border: 0; background: none; padding: 2px 2px 0; color: #53665b; font-size: .9rem; font-weight: 700; text-decoration: none; }
.atlas-nav .nav-current { color: var(--teal-dark); box-shadow: inset 0 -3px #296449; }
.mast-actions { margin-left: auto; gap: 8px; }
.mast-actions svg, #destination-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linejoin: round; }
.tool-btn, .icon-btn, .toolbar select { box-shadow: none; border-radius: 8px; }
.mast-actions #save-btn { display: flex; align-items: center; gap: 8px; background: #fbfcf8; }
.mast-actions #help-btn { border-radius: 50%; }
.landscape { position: relative; isolation: isolate; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; min-height: clamp(167px, 15vw, 235px); padding: clamp(19px, 2.4vw, 38px); overflow: hidden; color: white; border-radius: 13px; background: #254d49 center 50% / cover no-repeat; }

uler = null;\nlet interpreter = null;\nlet running = false;\nlet successPlayed = false;\nlet runCompleted = false;\nlet stuckDialogOpen = false;\n\nconst turtleStage = new TurtleStage(document.getElementById('pen-canvas'), document.getElementById('actor-canvas'));\nconst spriteStage = new SpriteStage(document.getElementById('sprite-canvas'), function () { return project; });\nconst deviceStage = new DeviceStage(document.getElementById('device-stage'), function () { updateMissionProgress(); }, audio);\nconst stages = { turtle: turtleStage, sprite: spriteStage, device: deviceStage };\nconst spriteShapes = ['cat', 'robot', 'car', 'ball', 'rocket', 'bug', 'heart', 'star'];\nconst spriteBackgrounds = ['sky', 'mint', 'sunset', 'night', 'candy', 'paper'];\n\nfunction activeStage() { return stages[project.stage] || turtleStage; }\nfunction rubyEnabled() { return project.level === 3 || (project.level >= 4 && localStorage.getItem('bs.ruby') !== '0'); }\n\nfunction toast(message, error) {\n  const region = document.getElementById('toast-region');\n  const item = document.createElement('div');\n  item.className = 'toast' + (error ? ' toast--error' : '');\n  item.textContent = message;\n  region.appendChild(item);\n  setTimeout(function () { item.remove(); }, error ? 5200 : 2600);\n}\n\nfunction copyText(value) {\n  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(value);\n  const area = document.createElement('textarea');\n  area.value = value; area.style.position = 'fixed'; area.style.opacity = '0'; document.body.appendChild(area); area.select();\n  const copied = document.execCommand('copy'); area.remove();\n  return copied ? Promise.resolve() : Promise.reject(new Error('copy'));\n}\n\nfunction renderLevel() {\n  for (let level = 1; level <= 5; level += 1) document.body.classList.remove('level-' + level);\n  document.body.classList.add('level-' + project.level);\n  if (levelLocked) document.getElementById('level-btn').title = 'せんせ ction runProject() {\n  if (running) return;\n  successPlayed = false;\n  runCompleted = false;\n  activeStage().reset();\n  scheduler = makeScheduler();\n  updateMissionProgress();\n  if (scheduler.start('event_start')) toast(UI.running);\n  else if (project.scripts.some(script => ['event_key', 'event_click'].includes(script.blocks[0]?.type))) toast('キーや キャラを おして はじめよう');\n  else toast('「はじまり」の ブロックを おこう');\n}\n\nfunction triggerProjectEvent(type, detail) {\n  const hasHat = project.scripts.some(script => script.blocks[0]?.type === type);\n  if (!hasHat) return;\n  if (!scheduler) scheduler = makeScheduler();\n  if (!scheduler.matching(type, detail).length) return;\n  runCompleted = false;\n  scheduler.trigger(type, detail);\n}\n\nfunction stopRun(showMessage) {\n  runCompleted = false;\n  if (scheduler) scheduler.stop();\n  scheduler = null; running = false; editor.setRunning(null); updateToolbar();\n  if (!showMessage) interpreter = null;\n  if (project.stage === 'device') { Object.keys(deviceStage.outputs).forEach(function (name) { deviceStage.outputs[name] = 0; }); deviceStage.render(); }\n  updateMissionProgress();\n  if (showMessage) toast(UI.stopped);\n}\n\nfunction discardExecution() {\n  if (scheduler) scheduler.stop();\n  if (interpreter) activeStage().reset();\n  scheduler = null;\n  interpreter = null;\n  runCompleted = false;\n  successPlayed = false;\n}\n\nfunction undo() {\n  if (running) return;\n  const snapshot = history.undo();\n  if (!snapshot) return;\n  discardExecution();\n  project = snapshot; renderAll();\n}\n\nfunction redo() {\n  if (running) return;\n  const snapshot = history.redo();\n  if (!snapshot) return;\n  discardExecution();\n  project = snapshot; renderAll();\n}\n\nfunction showLevelDialog() {\n  if (levelLocked) return;\n  const content = document.createElement('div'); content.className = 'dialog-list';\n  Object.keys(LEVELS).forEach(function (key) {\n    const level = Number(key); const button = document.createElement('button'  }\n];\n\nconst advanced = [\n  { id: 'tech_door', title: 'じどうドア', grade: '中学', subject: '技術', unit: '計測・制御', level: 4, stage: 'device', goal: '人感センサーで モーターを うごかそう。', starter: deviceStarter('motion', 'motor'), check: { kind: 'blockUsage', required: ['device_sensor_on', 'device_out_set'] } },\n  { id: 'tech_signal', title: 'じかんで かわる しんごうき', grade: '中学', subject: '技術', unit: '計測・制御', level: 4, stage: 'device', goal: 'まつ時間と LEDの色を くみあわせて、しんごうきを つくろう。', starter: signalStarter(), check: { kind: 'blockUsage', required: ['control_wait', 'device_led_color', 'device_out_set'] } },\n  { id: 'tech_fan', title: 'おんどで うごく ファン', grade: '中学', subject: '技術', unit: '計測・制御', level: 4, stage: 'device', goal: '温度が 28度より 高いとき、モーターの強さを 上げよう。', starter: fanStarter(), check: { kind: 'blockUsage', required: ['device_sensor', 'op_gt', 'device_out_power'] } },\n  { id: 'bidi_chat', title: 'メッセージで かいわ', grade: '中学', subject: '技術', unit: '双方向', level: 4, stage: 'sprite', goal: 'メッセージを おくり、べつの はじまりブロックで へんじを しよう。', scripts: [\n    { id: makeId('s'), x: 30, y: 30, blocks: [block('event_start'), block('looks_say', { TEXT: 'こんにちは！' }), block('control_broadcast', { MESSAGE: 'へんじ' })] },\n    { id: makeId('s'), x: 260, y: 30, blocks: [block('event_message', { MESSAGE: 'へんじ' }), block('looks_say', { TEXT: 'いっしょに つくろう！' })] }\n  ], sprites: [\n    { id: 'sp1', name: 'ねこ', shape: 'cat', x: -90, y: 0, dir: 90, size: 80, visible: true, color: '#f5a623' },\n    { id: 'sp2', name: 'ロボット', shape: 'robot', x: 100, y: 0, dir: 270, size: 80, visible: true, color: '#4c9bd6' }\n  ], check: { kind: 'blockUsage', required: ['control_broadcast', 'event_message'] } },\n  { id: 'bidi_bot', title: 'しつもんに こたえる ボット', grade: '中学', subject: '技術', unit: '双方向', level: 4, stage: 'sprite', goal: 'こたえに よって へんじを かえる ボットを つくろう。', starter: botStarter(), check: { kind: 'blockUsage', required: ['sensing_ask', 'sensing_answer', 'control_if_else'] } },\n  { id: 'free_draw', title: 'じゆうに おえかき', grade: '自由', subject: '自由', unit: 'おえかき', level: 1, stage: 'turtle', goal: 'ブロックを くみあわせて、すきな えを かこう。', starter: [block('event_start'), block('pen_down')], check: { kind: 'free' } },\n  { id: 'free_maze', title: 'めいろを すすもう', grade: '自由', subject: '自由', unit: 'ゲーム', level: 2, stage: 'sprite', goal: 'キーで キャラを うごかして、めいろの ゴールを めざそう。', starter: [block('event_key', { KEY: 'ArrowRight' }), block('motion_move', { STEPS: 20 }), block('motion_bounce')], check: { kind: 'free' } },\n  { id: 'free_shoot', title: 'シューティングを つくろう', grade: '自由', subject: '自由', unit: 'ゲーム', level: 3, stage: 'sprite', goal: 'キーや クリックを つかって、うごく ゲームを つくろう。', starter: [block('event_click'), block('sound_effect', { EFFECT: 'click' }), block('motion_move', { STEPS: 40 })], check: { kind: 'free' } },\n  { id: 'free_music', title: 'おんがくを つくろう', grade: '自由', subject: '自由', unit: '楽器', level: 1, stage: 'turtle', goal: 'おとの 高さと 長さを かえて、じぶんの おんがくを つくろう。', starter: [block('event_start'), block('sound_note', { NOTE: 60, SECS: .3 }), block('sound_note', { NOTE: 64, SECS: .3 }), block('sound_note', { NOTE: 67, SECS: .5 })], check: { kind: 'free' } }\n];\n\nconst expeditions = [\n  {\n    id: 'sossusvlei_survey', title: '砂丘の三角測量', grade: '小3〜', subject: '探検', unit: '回数と角度', level: 2, stage: 'turtle',\n    goal: '砂丘に見立てた3つの観測地点を正三角形で結ぼう。見本は2辺で止まるよ。',\n    hints: ['まず実行して、足りない辺を見つけよう。', '曲がる角度は120度のまま、くり返す回数を変えよう。'],\n    allowedBlocks: ['event_start', 'pen_down', 'pen_clear', 'turtle_forward', 'turtle_right', 'turtle_left', 'control_repeat'],\n    starter: polygonStarter(3, 2),\n    check: { kind: 'turtlePath', polygon: { sides: 3, tolerance: 6, closed: true }, required: ['control_repeat'] }\n  },\n  {\n    id: 'yakushima_canopy', title: '森の照度をしらべよう', grade: '小5〜', subject: '探検', unit: 'センサーと条件分岐', level: 3, stage: 'device',\n    goal: '木かげの観測灯を試そう。実行中に明るさを20にして点灯、次に70にして消灯させよう。',\n    hints: ['そうちの「明るさ」を動かそう。', 'この装置では明るさが35未満になると、明るさセンサーが反応するよ。'],\n    starter: deviceStarter('dark'),\n    check: { kind: 'deviceLog', rule: 'dark', requireBothStates: true, required: ['control_if_else', 'device_sensor_on'] }\n  }\n];\n\nexport const missions = [intro[1], ...expeditions, intro[0], ...intro.slice(2), ...polygons, ...science, ...advanced];\n", "js/audio/synth.js": "export class Synth {\n  constructor() { this.context = null; this.nodes = new Set(); this.timers = new Set(); this.muted = localStorage.getItem('bs.sound') === '0'; this.tempo = 100; }\n\n  setMuted(value) {\n    this.muted = Boolean(value);\n    localStorage.setItem('bs.sound', this.muted ? '0' : '1');\n    if (this.muted) this.stop();\n  }\n\n  setTempo(value) { this.tempo = Math.max(30, Math.min(300, Number(value) || 100)); }\n\n  later(run, milliseconds) {\n    const timer = setTimeout(() => { this.timers.delete(timer); run(); }, milliseconds);\n    this.timers.add(timer);\n  }\n\n  ensure() {\n    if (this.muted) return null;\n    if (!this.context) {\n      const Context = window.AudioContext || window.webkitAudioContext;\n      if (!Context) return null;\n      this.context = new Context();\n    }\n    if (this.context.state === 'suspended') this.context.resume();\n    return this.context;\n  }\n\n  tone(midi, seconds, wave) {\n    const context = this.ensure(); if (!context) return;\n    const oscillator = context.createOscillator(); const gain = context.createGain();\n    oscillator.type = wave || 'sine';\n    oscillator.frequency.value = 440 * Math.pow(2, (Number(midi) - 69) / 12);\n    gain.gain.setValueAtTime(.0001, context.currentTime);\n    gain.gain.exponentialRampToValueAtTime(.18, context.currentTime + .015);\n    gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + Math.max(.05, Number(seconds) || .2));\n    oscillator.connect(gain); gain.connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + Math.max(.06, Number(seconds) || .2) + .03);\n    this.nodes.add(oscillator); oscillator.onended = () => this.nodes.delete(oscillator);\n  }\n\n  effect(name) {\n    const beat = 100 / this.tempo;\n    if (name === 'boo') this.tone(38, .45, 'sawtooth');\n    else if (name === 'success') { this.tone(60, .2); this.later(() => this.tone(64, .2), 100 * beat); this.later(() => this.tone(67, .35), 200 * beat); }\n    else if (name === 'clap') { this.tone(72, .05, 'square'); this.later(() => this.tone(76, .05, 'square'), 80 * beat); }\n    else this.tone(84, .12, 'square');\n  }\n\n  click() { this.tone(80, .035, 'sine'); }\n  stop() { this.nodes.forEach(function (node) { try { node.stop(); } catch (error) { /* already stopped */ } }); this.nodes.clear(); this.timers.forEach(function (timer) { clearTimeout(timer); }); this.timers.clear(); }\n}\n", "js/expedition.js": "const places = [\n  { area: 'patagonia', mission: 'intro_square', region: 'チリ共和国 ／ パタゴニア', title: 'トーレス・デル・パイネ', latin: 'Torres del Paine National Park' },\n  { area: 'namib', mission: 'sossusvlei_survey', region: 'ナミビア ／ ナミブ砂漠', title: 'ソススフレイ', latin: 'Sossusvlei, Namib Desert' },\n  { area: 'yakushima', mission: 'yakushima_canopy', region: '日本 ／ 鹿児島県', title: '屋久島', latin: 'Yakushima Island' }\n];\n\nexport function renderLandscape(missionId) {\n  const place = places.find(item => item.mission === missionId) || places[0];\n  document.getElementById('landscape').dataset.area = place.area;\n  for (const key of ['region', 'title', 'latin']) {\n    document.getElementById('place-' + key).textContent = place[key];\n  }\n  return place.area;\n}\n\nexport function destinationMenu(getMission, start, lockedLevel) {\n  const list = document.createElement('div');\n  list.className = 'dialog-content site-list';\n  for (const place of places) {\n    const mission = getMission(place.mission);\n    const choice = document.createElement('button');\n    choice.type = 'button';\n    choice.className = 'site-choice';\n    choice.disabled = Boolean(lockedLevel && mission.level > lockedLevel);\n    const image = document.createElement('span');\n    image.className = 'site-thumb site-thumb--' + place.area;\n    image.setAttribute('aria-hidden', 'true');\n    const copy = document.createElement('span');\n    const title = document.createElement('strong');\n    const detail = document.createElement('small');\n    title.textContent = place.title;\n    detail.textContent = place.region + '　★' + mission.level + '　' + mission.title;\n    copy.append(title, detail);\n    choice.append(image, copy);\n    choice.addEventListener('click', () => start(mission));\n    list.appendChild(choice);\n  }\n  return list;\n}\n\nexport function showMobileView(view) {\n  const workspace = document.getElementById('workspace');\n  workspace.dataset.view = view;\n  workspace.classList.toggle('mobile-stage', view === 'stage');\n  for (const button of document.querySelectorAll('[data-mobile-view]')) {\n    const active = button.dataset.mobileView === view;\n    button.classList.toggle('is-active', active);\n    button.setAttribute('aria-pressed', String(active));\n  }\n}\n"};
  const urls = {};
  function normalize(parent, child) {
    const parts = parent.split('/'); parts.pop();
    child.split('/').forEach(function (part) { if (part === '..') parts.pop(); else if (part !== '.') parts.push(part); });

      return lead + quote + make(normalize(name, spec)) + quote;
